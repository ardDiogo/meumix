<!doctype html>
<html lang="pt-BR">
<body style="margin:0;padding:0;background:#08090B">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#08090B;padding:32px 12px;font-family:Arial,Helvetica,sans-serif">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px">
        <tr><td align="center" style="padding:0 0 20px">
          <img src="https://meumix.vercel.app/brand/logo.png" alt="MeuMix" width="180" style="display:block;width:180px;height:auto;border:0">
        </td></tr>
        <tr><td style="background:#121419;border:1px solid #2A2D34;border-top:3px solid #FF6A00;border-radius:12px;padding:28px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr><td style="color:#F5F5F5;font-size:22px;font-weight:bold;padding:0 0 10px">Código de confirmação</td></tr>
            <tr><td style="color:#A1A1AA;font-size:15px;line-height:1.55;padding:0 0 20px">Use o código abaixo para confirmar a ação na sua conta do MeuMix:</td></tr>
            <tr><td align="center" style="padding:4px 0 8px">
              <div style="display:inline-block;background:#191C22;border:1px solid #2A2D34;border-radius:10px;padding:14px 28px;color:#FF6A00;font-size:30px;font-weight:bold;letter-spacing:8px;font-family:Consolas,Menlo,monospace">{{ .Token }}</div>
            </td></tr>
            <tr><td style="color:#71717A;font-size:12px;line-height:1.5;padding:22px 0 0;border-top:1px solid #2A2D34">Se não foi você que pediu, ignore este e-mail e troque sua senha.</td></tr>
          </table>
        </td></tr>
        <tr><td align="center" style="color:#71717A;font-size:12px;padding:18px 0 0">
          MeuMix · Plataforma de mixes competitivos de CS2<br>
          <a href="https://meumix.vercel.app" style="color:#FF6A00;text-decoration:none">meumix.vercel.app</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
