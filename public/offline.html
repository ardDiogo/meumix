<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08090B" />
    <title>Sem conexão · MeuMix</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #08090b;
        color: #f5f5f5;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 360px;
        background: #121419;
        border: 1px solid #2a2d34;
        border-top: 3px solid #ff6a00;
        border-radius: 12px;
        padding: 28px 24px;
      }
      img {
        width: 160px;
        height: auto;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #a1a1aa;
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      a {
        display: inline-block;
        background: #ff6a00;
        color: #08090b;
        font-weight: 700;
        text-decoration: none;
        padding: 11px 22px;
        border-radius: 8px;
      }
      a:hover {
        background: #ff8533;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/brand/logo.png" alt="MeuMix" />
      <h1>Sem conexão</h1>
      <p>Você está offline. Assim que a internet voltar, o MeuMix carrega de novo com os dados atualizados.</p>
      <a href="/dashboard">Tentar de novo</a>
    </div>
  </body>
</html>
